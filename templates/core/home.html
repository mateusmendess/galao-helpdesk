{% extends "base.html" %}

{% block content %}
<main class="flex min-h-screen items-center justify-center p-4">
  <section class="w-full max-w-sm rounded-2xl bg-white p-8 text-center shadow-md">
    <h1 class="text-3xl font-bold">Troca do Galão</h1>
    <p class="mt-2 text-gray-600">Help Desk · em construção</p>
    <p class="mt-4 text-lg">Olá, {{ user.first_name|default:user.email }}</p>
    <span class="mt-4 inline-block rounded-full bg-blue-100 px-3 py-1 text-xs font-medium text-blue-800">Módulo 2</span>

    {% if user.is_staff and user.is_superuser %}
      <p class="mt-6">
        <a href="{% url 'admin:index' %}" class="font-medium text-blue-700 underline-offset-2 hover:underline">Painel de administração &rsaquo;</a>
      </p>
    {% endif %}

    <p class="mt-6">
      <a href="{% url 'password_change' %}" class="font-medium text-blue-700 underline-offset-2 hover:underline">Trocar senha &rsaquo;</a>
    </p>

    <form method="post" action="{% url 'logout' %}" class="mt-6">
      {% csrf_token %}
      <button type="submit"
              class="rounded-lg bg-gray-200 px-4 py-2 font-medium text-gray-800 hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2">
        Sair
      </button>
    </form>
  </section>
</main>
{% endblock %}
