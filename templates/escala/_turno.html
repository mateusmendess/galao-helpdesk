{# Uma linha do cartao em destaque: turno, horario e quem trabalha. #}
<div class="flex items-center justify-between gap-3 border-t border-borda py-2.5 first:border-t-0">
  <div class="shrink-0">
    <p class="font-bold">{{ rotulo }}</p>
    <p class="text-xs text-texto-suave">{{ horario }}</p>
  </div>
  <p class="min-w-0 text-right wrap-anywhere">
    {% if turno.nome %}{{ turno.nome }}{% if turno.voce %} <span class="whitespace-nowrap rounded-full bg-agua px-2 py-0.5 text-xs font-semibold text-tinta">você</span>{% endif %}{% else %}<span class="text-sm text-texto-suave">{{ vazio }}</span>{% endif %}
  </p>
</div>
