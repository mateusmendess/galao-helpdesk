{% extends "base.html" %}

{% block title %}Senha alterada - Troca do Galão{% endblock %}

{% block cabecalho %}{% include "_cabecalho.html" with marca_p=True sem_menu=True %}{% endblock %}

{% block content %}
<main class="mx-auto w-full max-w-md px-4 py-6 md:max-w-xl">
  <section class="rounded-[14px] border border-borda bg-white px-4 py-5 text-center">
    <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-ok-fundo text-ok">
      <svg class="h-8 w-8" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1 class="mt-3 text-2xl font-extrabold">Senha alterada</h1>
    <p class="mt-1 text-texto-suave">Sua senha foi alterada com sucesso.</p>
    <a href="{% url 'home' %}"
       class="mt-5 flex min-h-[52px] w-full items-center justify-center rounded-[10px] bg-tinta px-4 text-[17px] font-bold text-white hover:bg-[#093f57]">Voltar ao início</a>
  </section>
</main>
{% endblock %}
