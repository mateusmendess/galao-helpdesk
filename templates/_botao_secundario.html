{# Botao secundario (borda azul, fundo branco), igual nos quatro lugares.  #}
{# Parametros: href, texto e, se precisar, extra (classes de posicao).     #}
<a href="{{ href }}" class="botao-secundario flex min-h-12 items-center justify-center rounded-[10px] border-2 border-tinta bg-white px-3 py-1.5 text-center font-bold text-tinta hover:bg-agua {{ extra }}">{{ texto }}</a>
