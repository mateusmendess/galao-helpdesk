{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Troca do Galão{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="min-h-screen bg-gray-100 text-gray-900 antialiased">
  {% if messages %}
    <div class="mx-auto w-full max-w-sm space-y-2 px-4 pt-4">
      {% for mensagem in messages %}
        <p class="rounded-lg border px-4 py-3 text-sm {% if mensagem.level_tag == 'success' %}border-green-300 bg-green-50 text-green-900{% else %}border-red-200 bg-red-50 text-red-800{% endif %}" role="{% if mensagem.level_tag == 'success' %}status{% else %}alert{% endif %}">{{ mensagem }}</p>
      {% endfor %}
    </div>
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
