name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-e-testes:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: galao
          POSTGRES_PASSWORD: galao
          POSTGRES_DB: galao
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U galao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Valores so de teste, sem nada secreto (o banco existe so durante o job).
    env:
      SECRET_KEY: chave-falsa-somente-para-o-ci
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://galao:galao@localhost:5432/galao

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (formatacao)
        run: ruff format --check .

      - name: Django check
        run: python manage.py check

      - name: Migracoes pendentes
        run: python manage.py makemigrations --check --dry-run

      - name: Testes
        run: pytest
